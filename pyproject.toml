[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-nostr"
version = "0.1.0"
description = "Nostr (NIP-17 private DM) gateway platform plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "unsaltedbutter", email = "info@unsaltedbutter.ai" }]
keywords = ["hermes", "hermes-agent", "nostr", "nip-17", "gateway", "plugin", "chatbot", "dm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]

# Only hard runtime dependency. The host application (Hermes Agent) provides
# ``gateway.*`` / ``hermes_cli.*`` at runtime and is NOT listed here on purpose
# (it is the host, not a PyPI dependency). nostr-sdk ships as wheels only.
dependencies = [
  "nostr-sdk>=0.44.2,<0.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/unsaltedbutter-ai/hermes-nostr"
Repository = "https://github.com/unsaltedbutter-ai/hermes-nostr"
Issues = "https://github.com/unsaltedbutter-ai/hermes-nostr/issues"

# Hermes discovers pip-installed plugins through this entry-point group. The
# value is the package whose top level exposes ``register`` (the loader does
# ``getattr(module, "register")``), so it must be the MODULE, not ``:register``.
[project.entry-points."hermes_agent.plugins"]
nostr = "hermes_nostr"

[tool.hatch.build.targets.wheel]
packages = ["hermes_nostr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
